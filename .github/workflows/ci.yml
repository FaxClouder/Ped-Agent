name: Research module checks

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workspace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e Contracts -e Agent -e Knowledge-Base -e Video-Analysis pytest pytest-asyncio
      - name: Compile research modules
        run: python -m compileall Contracts/src Agent/src Knowledge-Base/src Video-Analysis/src
      - name: Run focused checks
        run: pytest Contracts/tests Agent/tests Knowledge-Base/tests Video-Analysis/tests -q
