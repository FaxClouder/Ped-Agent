[project]
name = "ped-agent-research-workspace"
version = "0.2.0"
description = "Research workspace for evidence-grounded pedestrian-flow experiments."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["Contracts", "Agent", "Knowledge-Base", "Video-Analysis"]

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = [
  "Contracts/tests",
  "Agent/tests",
  "Knowledge-Base/tests",
  "Video-Analysis/tests",
]
pythonpath = [
  "Contracts/src",
  "Agent/src",
  "Knowledge-Base/src",
  "Video-Analysis/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "Contracts/src",
  "Contracts/tests",
  "Agent/src",
  "Agent/tests",
  "Knowledge-Base/src",
  "Knowledge-Base/tests",
  "Video-Analysis/src",
  "Video-Analysis/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["ped_contracts", "ped_research_agent", "ped_knowledge", "ped_video_analysis"]
mypy_path = ["Contracts/src", "Agent/src", "Knowledge-Base/src", "Video-Analysis/src"]
ignore_missing_imports = true
strict = false
