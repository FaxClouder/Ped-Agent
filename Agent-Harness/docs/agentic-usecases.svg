<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="570" viewBox="0 0 1060 570" role="img" aria-labelledby="title desc">
  <title id="title">PedRAGent Agentic 研究能力范围</title>
  <desc id="desc">研究者使用现有检索与验证，通过待适配的领域工具接入待新增的迭代取证、预算和运行记录。状态是源码核查或后续目标。</desc>
  <rect width="1060" height="570" fill="white"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle">
    <text x="530" y="40" font-size="22" font-weight="bold">Agentic 研究：角色与能力范围</text>
    <g stroke="#cccccc" fill="none">
      <path d="M85 278 H100 M300 260 L360 100 M300 260 L360 180 M300 260 L360 260 M300 260 L360 340 M300 260 L360 420"/>
      <path d="M560 180 L600 180 M800 180 L840 140 M800 180 L840 220 M560 340 L600 340 M800 340 L840 340"/>
    </g>
    <g stroke="#333" stroke-width="2" fill="none">
      <circle cx="60" cy="242" r="18"/><path d="M60 260 V300 M35 278 H85 M60 300 L38 330 M60 300 L82 330"/>
    </g>
    <text x="60" y="350" fill="#222">研究者</text>
    <ellipse cx="200" cy="260" rx="100" ry="28" fill="#7b5ea7" stroke="#7b5ea7"/>
    <text x="200" y="265" fill="white">证据科研问答</text>
    <g fill="#f8f8f8" stroke="#bbbbbb">
      <ellipse cx="460" cy="100" rx="100" ry="28"/>
      <ellipse cx="460" cy="420" rx="100" ry="28"/>
    </g>
    <text x="460" y="105">文献检索与版本校验</text><text x="460" y="425">引用与 claim 验证</text>
    <g fill="#fff8e6" stroke="#e07b00">
      <ellipse cx="460" cy="180" rx="100" ry="28"/>
      <ellipse cx="460" cy="340" rx="100" ry="28"/>
    </g>
    <text x="460" y="185" fill="#7a4a00">知识工具适配</text><text x="460" y="345" fill="#7a4a00">分析证据适配</text>
    <g fill="white" stroke="#4a7fd4">
      <ellipse cx="460" cy="260" rx="100" ry="28"/>
      <ellipse cx="700" cy="180" rx="100" ry="28"/>
      <ellipse cx="940" cy="140" rx="100" ry="28"/>
      <ellipse cx="940" cy="220" rx="100" ry="28"/>
      <ellipse cx="700" cy="340" rx="100" ry="28"/>
      <ellipse cx="940" cy="340" rx="100" ry="28"/>
    </g>
    <g fill="#1a4a8a">
      <text x="460" y="265">运行配置与执行记录</text><text x="700" y="185">需求规划与迭代取证</text>
      <text x="940" y="145">充分性与停止判断</text><text x="940" y="225">预算与取消执行</text>
      <text x="700" y="345">固定数值结果引用</text><text x="940" y="345">多源证据组合验证</text>
    </g>
    <g font-size="13">
      <rect x="640" y="475" width="18" height="16" fill="#f8f8f8" stroke="#bbbbbb"/><text x="700" y="488">已有</text>
      <rect x="740" y="475" width="18" height="16" fill="#fff8e6" stroke="#e07b00"/><text x="810" y="488">拟适配</text>
      <rect x="850" y="475" width="18" height="16" fill="white" stroke="#4a7fd4"/><text x="930" y="488">拟新增</text>
      <text x="530" y="535" fill="#555">已有指源码存在；拟适配 / 拟新增均为后续计划，本轮未实现。</text>
    </g>
  </g>
</svg>
