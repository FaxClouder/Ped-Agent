[project]
name = "ped-agent-server"
version = "0.1.0"
description = "Local-first pedestrian-flow knowledge foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chromadb>=1.0,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jieba>=0.42,<1",
  "langchain-anthropic>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langsmith>=0.10,<1",
  "ped-agent-core",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-dotenv>=1.1,<2",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
ped-agent = "ped_agent_server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ped_agent_server"]

[tool.uv.sources]
ped-agent-core = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
