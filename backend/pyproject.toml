[project]
name = "ped-agent"
version = "0.1.0"
description = "Local-first pedestrian-flow knowledge foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jieba>=0.42,<1",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
ped-agent = "ped_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ped_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
